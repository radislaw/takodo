<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TooToo — UI Components</title>
    <link rel="stylesheet" href="colors_and_type.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: var(--cream);
        font-family: var(--font-body);
        color: var(--ink);
      }

      /* ── page header ─────────────────────────────────── */
      .pg-hd {
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .pg-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 21px;
        color: var(--ink);
      }
      .pg-logo span {
        color: var(--sage-deep);
      }
      .pg-sub {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-top: 2px;
        font-family: var(--font-body);
      }
      .pg-pill {
        background: var(--sage-tint);
        color: var(--sage-deep);
        font-family: var(--font-body);
        font-size: 11.5px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }

      /* ── theme bar ───────────────────────────────────── */
      .theme-bar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 9px 18px;
        display: flex;
        gap: 7px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .theme-bar::-webkit-scrollbar {
        display: none;
      }
      .t-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1.5px solid transparent;
        cursor: pointer;
        white-space: nowrap;
        font-family: var(--font-body);
        font-size: 12.5px;
        font-weight: 600;
        background: var(--cream-deep);
        color: var(--ink-soft);
      }
      .t-btn.on {
        background: var(--sage-tint);
        color: var(--sage-deep);
        border-color: var(--sage);
      }
      .t-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* ── grid layout ─────────────────────────────────── */
      .grid {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 22px 80px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
          padding: 16px 12px 60px;
        }
      }

      /* ── section card ────────────────────────────────── */
      .sec {
        background: var(--card);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-md);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .sec.wide {
        grid-column: 1/-1;
      }
      .sec.app-bg {
        background: var(--cream-deep);
      }
      .sec-ttl {
        font-family: var(--font-body);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.065em;
        text-transform: uppercase;
        color: var(--ink-faint);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line-card);
      }

      /* ── layout helpers ──────────────────────────────── */
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        align-items: center;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .vr {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .vr-lbl {
        font-size: 9.5px;
        font-family: var(--font-body);
        font-weight: 600;
        color: var(--ink-faint);
        letter-spacing: 0.02em;
      }
      .sep {
        border-top: 1px solid var(--line-card);
        margin: 2px 0;
      }

      /* ── buttons ─────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        cursor: pointer;
        border: none;
        font-family: var(--font-body);
        font-weight: 700;
        outline: none;
      }
      .btn:focus-visible {
        box-shadow: var(--ring);
      }
      .btn-pr {
        background: var(--accent-fill);
        color: #fff;
        border-radius: var(--r-md);
        padding: 11px 20px;
        font-size: 15px;
        box-shadow: 0 4px 14px rgba(124, 154, 146, 0.28);
      }
      .btn-sc {
        background: transparent;
        color: var(--sage-deep);
        border: 1.5px solid var(--sage);
        border-radius: var(--r-md);
        padding: 10px 18px;
        font-size: 15px;
      }
      .btn-gh {
        background: transparent;
        color: var(--ink);
        border-radius: var(--r-md);
        padding: 10px 14px;
        font-size: 15px;
        border: none;
      }
      .btn-dn {
        background: var(--softrose-tint);
        color: var(--softrose);
        border: 1.5px solid var(--softrose);
        border-radius: var(--r-md);
        padding: 10px 18px;
        font-size: 15px;
      }
      .btn-sm {
        padding: 7px 14px !important;
        font-size: 12.5px !important;
        border-radius: var(--r-sm) !important;
      }
      .btn-fab {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: var(--accent-fill);
        color: #fff;
        box-shadow: 0 6px 18px rgba(124, 154, 146, 0.42);
        padding: 0;
        border: none;
      }
      .btn-ic {
        width: 40px;
        height: 40px;
        border-radius: var(--r-xs);
        background: var(--cream-deep);
        color: var(--ink-soft);
        padding: 0;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .btn-ic-rnd {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--cream-deep);
        color: var(--ink-soft);
        padding: 0;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }

      /* ── inputs ──────────────────────────────────────── */
      .inp {
        width: 100%;
        font-family: var(--font-body);
        font-size: 14.5px;
        color: var(--ink);
        background: var(--cream-deep);
        border: 1.5px solid var(--line);
        border-radius: var(--r-sm);
        padding: 11px 14px;
        outline: none;
      }
      .inp::placeholder {
        color: var(--ink-faint);
      }
      .inp:focus {
        border-color: var(--sage);
        box-shadow: var(--ring);
        background: var(--card);
      }
      .inp.err {
        border-color: var(--softrose);
      }
      .inp.err:focus {
        box-shadow: var(--ring-apr);
      }
      .inp:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .inp-lbl {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-soft);
        font-family: var(--font-body);
      }
      .inp-hint {
        font-size: 11px;
        color: var(--ink-faint);
        font-family: var(--font-body);
      }
      .inp-err {
        font-size: 11px;
        color: var(--softrose);
        font-family: var(--font-body);
      }

      /* ── checkbox ────────────────────────────────────── */
      .chk {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
      }
      .chk.empty {
        border: 2px solid var(--line-strong);
        border-radius: 999px;
        background: var(--card);
      }
      .chk.sage {
        border: none;
        border-radius: 999px;
        background: var(--accent-fill);
      }
      .chk.apr {
        border: none;
        border-radius: 999px;
        background: var(--reward-fill);
        box-shadow: 0 3px 10px rgba(224, 168, 126, 0.45);
      }

      /* ── chips & badges ──────────────────────────────── */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 999px;
        font-family: var(--font-body);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1.5px solid var(--line);
        background: var(--cream-deep);
        color: var(--ink-soft);
      }
      .chip.on {
        background: var(--sage-tint);
        color: var(--sage-deep);
        border-color: var(--sage);
      }
      .cdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 700;
      }
      .b-str {
        background: var(--apricot-tint);
        color: var(--apricot-deep);
      }
      .b-don {
        background: var(--done-tint);
        color: var(--done);
      }
      .b-gen {
        background: var(--gentle-tint);
        color: var(--gentle);
      }
      .b-ros {
        background: var(--softrose-tint);
        color: var(--softrose);
      }

      /* ── task card ───────────────────────────────────── */
      .task {
        background: var(--card);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-md);
        padding: 13px 15px;
        display: flex;
        gap: 11px;
        align-items: flex-start;
      }
      .task-t {
        font-family: var(--font-body);
        font-size: 14.5px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.3;
      }
      .task-t.done {
        color: var(--ink-faint);
        text-decoration: line-through;
        text-decoration-color: var(--ink-faint);
      }
      .task-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 5px;
      }
      .task-cat {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-soft);
        font-family: var(--font-body);
      }
      .task-bar {
        height: 5px;
        border-radius: 999px;
        background: var(--sage-tint-2);
        overflow: hidden;
        flex: 1;
        max-width: 110px;
      }
      .task-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent-fill);
      }

      /* ── progress bar ────────────────────────────────── */
      .pbar {
        height: 7px;
        border-radius: 999px;
        background: var(--sage-tint-2);
        overflow: hidden;
      }
      .pbar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent-fill);
      }

      /* ── nav ─────────────────────────────────────────── */
      .nav {
        display: flex;
        justify-content: space-around;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 10px 0 16px;
        border-radius: 0 0 var(--r-xl) var(--r-xl);
      }
      .nav-i {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 12px;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 10px;
        font-weight: 700;
        border: none;
        background: none;
      }
      .nav-i.on {
        color: var(--sage-deep);
      }
      .nav-i.off {
        color: var(--ink-faint);
      }

      /* ── toast ───────────────────────────────────────── */
      .toast {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        padding: 10px 17px;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 13.5px;
        box-shadow: var(--shadow-pop);
      }

      /* ── sheet ───────────────────────────────────────── */
      .sheet {
        background: var(--card);
        border-radius: 22px 22px 0 0;
        padding: 12px 18px 22px;
        box-shadow: var(--shadow-pop);
      }
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: var(--line-strong);
        margin: 0 auto 14px;
      }

      /* ── app cards ───────────────────────────────────── */
      .summary {
        background: var(--card);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-md);
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .focus-card {
        background: var(--card);
        border: 1.5px solid var(--sage-tint-2);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-sm);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .rew-hero {
        background: var(--apricot-tint);
        border-radius: var(--r-xl);
        padding: 16px 18px;
        box-shadow: var(--shadow-sm);
      }
      .rew-card {
        background: var(--card);
        border-radius: var(--r-md);
        padding: 12px 13px;
        box-shadow: var(--shadow-sm);
      }

      /* ── color swatches ──────────────────────────────── */
      .sw-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .sw-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 62px;
      }
      .sw-color {
        width: 62px;
        height: 38px;
        border-radius: var(--r-xs);
        border: 1px solid var(--line);
      }
      .sw-name {
        font-size: 9px;
        font-weight: 600;
        color: var(--ink-faint);
        font-family: var(--font-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── icon tiles ──────────────────────────────────── */
      .icon-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .icon-tile {
        width: 48px;
        height: 48px;
        border-radius: var(--r-sm);
        background: var(--sage-tint);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sage-deep);
      }
      .icon-tile.apr {
        background: var(--apricot-tint);
        color: var(--apricot-deep);
      }
      .icon-tile.cre {
        background: var(--cream-deep);
        color: var(--ink-soft);
      }

      /* ── typography rows ─────────────────────────────── */
      .typo-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line-card);
      }
      .typo-lbl {
        font-family: var(--font-body);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        color: var(--ink-faint);
        min-width: 68px;
        flex-shrink: 0;
      }

      /* ── shadow demos ────────────────────────────────── */
      .sh-demo {
        background: var(--card);
        border-radius: var(--r-md);
        padding: 12px 16px;
        font-family: var(--font-body);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
        text-align: center;
      }
    </style>
  </head>

        cloud: 'M17.5 19a4.5 4.5 0 1 0 0-9 .2.2 0 0 1-.2-.16A6 6 0 1 0 6.5 19z',

        if (name === 'sun') extra.push(<circle key="c" cx={12} cy={12} r={4} />)
        if (name === 'eye') extra.push(<circle key="c" cx={12} cy={12} r={3} />)
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke={color}
            strokeWidth={sw}
            strokeLinecap="round"
            strokeLinejoin="round"
            style={style}
          >
            {d && <path d={d} />}
            {extra}

          return (
            <div

                height: 68,
                borderRadius: 999,
                flexShrink: 0,
                background: `conic-gradient(${fill} ${pct}%, ${track} ${pct}% 100%)`,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',

            >
              <div
                style={{
                  width: 50,
                  height: 50,

                  style={{ fontSize: 8.5, color: 'var(--ink-soft)', fontWeight: 600, marginTop: 1 }}

            <div className="sep" />

                <button
                  key={t.id}
                  className={'t-btn' + (theme === t.id ? ' on' : '')}
                  onClick={() => setTheme(t.id)}
                >
                  <span className="t-dot" style={{ background: t.accent }} />
                  {t.label}
                </button>
              ))}
            </div>

            {/* Grid */}
            <div className="grid">
              <BtnSec />
              <InputSec />
              <ChkSec />
              <ChipsSec />
              <TaskSec />
              <ProgressSec />
              <NavSec />
              <SheetsSec />
              <AppCardsSec />
              <TypoSec />
              <ColorsSec />
              <IconsSec />
              <ElevationSec />
              <SpacingSec />
            </div>
          </>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>

openapi: 3.0.0
info:
  title: tootoo API
  description: |-
    tootoo API — the single source of truth contract.
    Scope: Phase 0.4 — single-user, no auth.
    Changes happen only here → regen OpenAPI/types. Do not edit generated output by hand.
  version: 0.0.0
tags:
  - name: Tasks
  - name: Daily
  - name: Profile
  - name: Rewards
  - name: Quests
  - name: Push
  - name: Frequent
paths:
  /daily:
    post:
      operationId: Daily_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyList'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyListCreate'
  /daily/{date}:
    get:
      operationId: Daily_getByDate
      description: List for a date with its entries (history = past dates).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyListDetail'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
  /daily/{date}/entries:
    post:
      operationId: Daily_addEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntry'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntry'
  /daily/{date}/entries/{entryId}:
    patch:
      operationId: Daily_updateEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntry'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
    delete:
      operationId: Daily_removeEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
  /daily/{date}/entries/{entryId}/move-to-tomorrow:
    post:
      operationId: Daily_moveToTomorrow
      description: Move an entry from this day to tomorrow atomically. Increments the user's gentleMoves counter.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntry'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
  /frequent:
    get:
      operationId: Frequent_list
      description: Tasks that stayed undone in >= minDays days (matched by normalizedTitle).
      parameters:
        - name: minDays
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrequentTask'
      tags:
        - Frequent
  /me:
    get:
      operationId: Me_get
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
      tags:
        - Profile
    patch:
      operationId: Me_update
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /push/subscribe:
    post:
      operationId: Push_subscribe
      description: Register a browser PushSubscription. Idempotent (upserts by endpoint).
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscribeBody'
    delete:
      operationId: Push_unsubscribe
      description: Remove a browser PushSubscription.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeBody'
  /push/vapid-key:
    get:
      operationId: Push_getVapidKey
      description: VAPID public key for the web client to create a PushSubscription.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Push
  /quests:
    get:
      operationId: Quests_list
      description: Today's three deterministic quests (hash of userId+date) with live progress.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quest'
      tags:
        - Quests
  /quests/{id}/claim:
    post:
      operationId: Quests_claim
      description: 'Claim a completed quest: server validates progress, rolls tier, awards XP.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Quests
  /rewards:
    get:
      operationId: Rewards_get
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardsSummary'
      tags:
        - Rewards
  /tasks:
    get:
      operationId: Tasks_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
      tags:
        - Tasks
    post:
      operationId: Tasks_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
  /tasks/{id}:
    get:
      operationId: Tasks_read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
    patch:
      operationId: Tasks_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
    delete:
      operationId: Tasks_del
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/complete:
    post:
      operationId: Tasks_complete
      description: Mark as done; the server bubbles up (all children done → parent done).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/focus:
    post:
      operationId: Tasks_recordFocus
      description: Record focused time (and optionally a completed Pomodoro) on the task.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusRecord'
  /tasks/{id}/reopen:
    post:
      operationId: Tasks_reopen
      description: Return to open (server handles recursive down/up as needed).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/resolve-resistance:
    post:
      operationId: Tasks_resolveResistance
      description: '"No resistance, I can do it" → resistanceResolved = true.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/tree:
    get:
      operationId: Tasks_tree
      description: Full subtree of the task.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNode'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
components:
  schemas:
    AddEntry:
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    Badge:
      type: object
      required:
        - id
        - earned
      properties:
        id:
          type: string
          description: Stable id → maps to localized copy on the web.
        earned:
          type: boolean
        remaining:
          type: integer
          format: int32
          description: Units left before earning (e.g. days remaining for a streak badge).
      description: Achievement badge. Title/description live in web i18n, keyed by id.
    DailyEntry:
      type: object
      required:
        - id
        - taskId
        - isMIT
        - order
      properties:
        id:
          type: string
        taskId:
          type: string
        isMIT:
          type: boolean
          description: One of the "3 most important tasks today" (MIT). Limit of 3 is server behavior.
        order:
          type: integer
          format: int32
    DailyList:
      type: object
      required:
        - id
        - date
        - createdAt
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    DailyListCreate:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
    DailyListDetail:
      type: object
      required:
        - id
        - date
        - createdAt
        - entries
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DailyEntry'
    DayActivity:
      type: object
      required:
        - date
        - active
      properties:
        date:
          type: string
          format: date
        active:
          type: boolean
          description: User completed at least one task that day.
        shielded:
          type: boolean
          description: Inactive day covered by a streak shield (streak preserved).
      description: One day cell in the weekly streak strip.
    EntryUpdate:
      type: object
      properties:
        isMIT:
          type: boolean
        order:
          type: integer
          format: int32
    FocusRecord:
      type: object
      required:
        - seconds
      properties:
        seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 7200
          description: Focused seconds to add (1–7200).
        pomodoro:
          type: boolean
          description: True when a full 25-min Pomodoro was completed → increments counter.
    FrequentTask:
      type: object
      required:
        - normalizedTitle
        - title
        - undoneDays
      properties:
        normalizedTitle:
          type: string
        title:
          type: string
        undoneDays:
          type: integer
          format: int32
          description: In how many past days the task stayed undone.
    Profile:
      type: object
      required:
        - name
        - theme
        - notifMorning
        - notifEvening
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name used in the greeting.
        theme:
          $ref: '#/components/schemas/Theme'
        notifMorning:
          type: boolean
          description: Opt-in morning reminder (~9 AM).
        notifEvening:
          type: boolean
          description: Opt-in evening reminder (~8 PM).
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        theme:
          allOf:
            - $ref: '#/components/schemas/Theme'
          description: Rejected with 403 `theme_locked` when the theme is not unlocked at the user's level.
        notifMorning:
          type: boolean
        notifEvening:
          type: boolean
    PushSubscribeBody:
      type: object
      required:
        - endpoint
        - p256dh
        - auth
      properties:
        endpoint:
          type: string
          maxLength: 2048
        p256dh:
          type: string
          maxLength: 256
        auth:
          type: string
          maxLength: 64
    PushUnsubscribeBody:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          maxLength: 2048
    Quest:
      type: object
      required:
        - id
        - target
        - progress
        - done
        - claimed
      properties:
        id:
          type: string
          description: Stable quest definition id → maps to localized copy on the web.
        target:
          type: integer
          format: int32
        progress:
          type: integer
          format: int32
        done:
          type: boolean
          description: progress >= target — the quest can be claimed.
        claimed:
          type: boolean
        tier:
          allOf:
            - $ref: '#/components/schemas/QuestTier'
          description: Rolled server-side on claim (70/25/5).
        xp:
          type: integer
          format: int32
          description: XP awarded on claim, by tier.
      description: Daily quest with live progress. Title/description live in web i18n, keyed by id.
    QuestTier:
      type: string
      enum:
        - common
        - rare
        - epic
    RewardsSummary:
      type: object
      required:
        - streak
        - longestStreak
        - shields
        - shieldUsedRecently
        - week
        - badges
        - xp
        - level
      properties:
        streak:
          type: integer
          format: int32
        longestStreak:
          type: integer
          format: int32
        shields:
          type: integer
          format: int32
          description: Streak shields available (earned every 5 active streak days, max 2).
        shieldUsedRecently:
          type: boolean
          description: A shield was consumed within the last 7 days.
        week:
          type: array
          items:
            $ref: '#/components/schemas/DayActivity'
          description: Last 7 days, Monday-first.
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
        xp:
          type: integer
          format: int32
          description: Total experience points accumulated (done×10, MIT×5, pomodoro×5).
        level:
          type: integer
          format: int32
          description: 'Current level, 1-based: level = floor(sqrt(xp/100)) + 1.'
        comebackDays:
          type: integer
          format: int32
          description: Full missed days before today; present only in comeback state (>= 2).
    Task:
      type: object
      required:
        - id
        - parentId
        - title
        - resistanceResolved
        - status
        - completedAt
        - normalizedTitle
        - focusSeconds
        - pomodoros
        - createdAt
      properties:
        id:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent in the tree; null = root.
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        resistanceResolved:
          type: boolean
          description: User pressed "I can do this" → task became an executable leaf.
        estimateMinutes:
          type: integer
          format: int32
          description: 'Time estimate, minutes (CBT: externalize time).'
        status:
          $ref: '#/components/schemas/TaskStatus'
        category:
          $ref: '#/components/schemas/TaskCategory'
        completedAt:
          type: string
          format: date-time
          nullable: true
        normalizedTitle:
          type: string
          description: lower+trim of the title — used to match "frequently undone" tasks.
        focusSeconds:
          type: integer
          format: int32
          description: Accumulated focused seconds (from Pomodoro sessions). Server-set.
        pomodoros:
          type: integer
          format: int32
          description: Completed 25-minute Pomodoros. Server-set.
        createdAt:
          type: string
          format: date-time
      description: Task (read shape). Fields not client-writable are set by the server.
    TaskCategory:
      type: string
      enum:
        - home
        - health
        - work
        - self
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        parentId:
          type: string
          description: Parent when splitting; absent = root task of the day.
        estimateMinutes:
          type: integer
          format: int32
        category:
          $ref: '#/components/schemas/TaskCategory'
    TaskNode:
      type: object
      required:
        - id
        - parentId
        - title
        - resistanceResolved
        - status
        - completedAt
        - normalizedTitle
        - focusSeconds
        - pomodoros
        - createdAt
        - children
      properties:
        id:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent in the tree; null = root.
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        resistanceResolved:
          type: boolean
          description: User pressed "I can do this" → task became an executable leaf.
        estimateMinutes:
          type: integer
          format: int32
          description: 'Time estimate, minutes (CBT: externalize time).'
        status:
          $ref: '#/components/schemas/TaskStatus'
        category:
          $ref: '#/components/schemas/TaskCategory'
        completedAt:
          type: string
          format: date-time
          nullable: true
        normalizedTitle:
          type: string
          description: lower+trim of the title — used to match "frequently undone" tasks.
        focusSeconds:
          type: integer
          format: int32
          description: Accumulated focused seconds (from Pomodoro sessions). Server-set.
        pomodoros:
          type: integer
          format: int32
          description: Completed 25-minute Pomodoros. Server-set.
        createdAt:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/TaskNode'
      description: Task with its recursive subtree (unbounded depth).
    TaskStatus:
      type: string
      enum:
        - open
        - done
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 5000
        estimateMinutes:
          type: integer
          format: int32
        category:
          $ref: '#/components/schemas/TaskCategory'
    Theme:
      type: string
      enum:
        - light
        - lavender
        - cloud
        - eco
        - ocean
        - silent
        - high-contrast
        - dark
        - lavender-dark
        - cyberpunk
        - amber
        - amoled
      description: Matches data-theme attribute values in tokens.css.
    VapidPublicKey:
      type: object
      required:
        - publicKey
      properties:
        publicKey:
          type: string

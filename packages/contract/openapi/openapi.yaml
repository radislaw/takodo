openapi: 3.0.0
info:
  title: tootoo API
  description: |-
    tootoo API — the single source of truth contract.
    Scope: Phase 0.4 — single-user, no auth.
    Changes happen only here → regen OpenAPI/types. Do not edit generated output by hand.
  version: 0.0.0
tags:
  - name: Tasks
  - name: Daily
  - name: Frequent
paths:
  /daily:
    post:
      operationId: Daily_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyList'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyListCreate'
  /daily/{date}:
    get:
      operationId: Daily_getByDate
      description: List for a date with its entries (history = past dates).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyListDetail'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
  /daily/{date}/entries:
    post:
      operationId: Daily_addEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntry'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntry'
  /daily/{date}/entries/{entryId}:
    patch:
      operationId: Daily_updateEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntry'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
    delete:
      operationId: Daily_removeEntry
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Daily
  /frequent:
    get:
      operationId: Frequent_list
      description: Tasks that stayed undone in >= minDays days (matched by normalizedTitle).
      parameters:
        - name: minDays
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrequentTask'
      tags:
        - Frequent
  /tasks:
    get:
      operationId: Tasks_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
      tags:
        - Tasks
    post:
      operationId: Tasks_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
  /tasks/{id}:
    get:
      operationId: Tasks_read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
    patch:
      operationId: Tasks_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
    delete:
      operationId: Tasks_del
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/complete:
    post:
      operationId: Tasks_complete
      description: Mark as done; the server bubbles up (all children done → parent done).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/reopen:
    post:
      operationId: Tasks_reopen
      description: Return to open (server handles recursive down/up as needed).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/resolve-resistance:
    post:
      operationId: Tasks_resolveResistance
      description: '"No resistance, I can do it" → resistanceResolved = true.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
  /tasks/{id}/tree:
    get:
      operationId: Tasks_tree
      description: Full subtree of the task.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNode'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Tasks
components:
  schemas:
    AddEntry:
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    DailyEntry:
      type: object
      required:
        - id
        - taskId
        - isMIT
        - order
      properties:
        id:
          type: string
        taskId:
          type: string
        isMIT:
          type: boolean
          description: One of the "3 most important tasks today" (MIT). Limit of 3 is server behavior.
        order:
          type: integer
          format: int32
    DailyList:
      type: object
      required:
        - id
        - date
        - createdAt
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    DailyListCreate:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
    DailyListDetail:
      type: object
      required:
        - id
        - date
        - createdAt
        - entries
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DailyEntry'
    EntryUpdate:
      type: object
      properties:
        isMIT:
          type: boolean
        order:
          type: integer
          format: int32
    FrequentTask:
      type: object
      required:
        - normalizedTitle
        - title
        - undoneDays
      properties:
        normalizedTitle:
          type: string
        title:
          type: string
        undoneDays:
          type: integer
          format: int32
          description: In how many past days the task stayed undone.
    Task:
      type: object
      required:
        - id
        - parentId
        - title
        - resistanceResolved
        - status
        - completedAt
        - normalizedTitle
        - createdAt
      properties:
        id:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent in the tree; null = root.
        title:
          type: string
        note:
          type: string
        resistanceResolved:
          type: boolean
          description: User pressed "I can do this" → task became an executable leaf.
        estimateMinutes:
          type: integer
          format: int32
          description: 'Time estimate, minutes (CBT: externalize time).'
        status:
          $ref: '#/components/schemas/TaskStatus'
        completedAt:
          type: string
          format: date-time
          nullable: true
        normalizedTitle:
          type: string
          description: lower+trim of the title — used to match "frequently undone" tasks.
        createdAt:
          type: string
          format: date-time
      description: Task (read shape). Fields not client-writable are set by the server.
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        note:
          type: string
        parentId:
          type: string
          description: Parent when splitting; absent = root task of the day.
        estimateMinutes:
          type: integer
          format: int32
    TaskNode:
      type: object
      required:
        - id
        - parentId
        - title
        - resistanceResolved
        - status
        - completedAt
        - normalizedTitle
        - createdAt
        - children
      properties:
        id:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent in the tree; null = root.
        title:
          type: string
        note:
          type: string
        resistanceResolved:
          type: boolean
          description: User pressed "I can do this" → task became an executable leaf.
        estimateMinutes:
          type: integer
          format: int32
          description: 'Time estimate, minutes (CBT: externalize time).'
        status:
          $ref: '#/components/schemas/TaskStatus'
        completedAt:
          type: string
          format: date-time
          nullable: true
        normalizedTitle:
          type: string
          description: lower+trim of the title — used to match "frequently undone" tasks.
        createdAt:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/TaskNode'
      description: Task with its recursive subtree (unbounded depth).
    TaskStatus:
      type: string
      enum:
        - open
        - done
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        note:
          type: string
        estimateMinutes:
          type: integer
          format: int32
